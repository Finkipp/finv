{% extends "inventory/base.html" %}
{% block content %}
<div class="page-header">
    <h1>📋 {{ ref_name }}</h1>
    {% if can_add %}
    <a href="{% url ref_url|add:'_add' %}" class="btn btn-primary">+ Добавить</a>
    {% endif %}
</div>

<div class="card">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Наименование</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item }}</td>
                    <td>
                        <div class="btn-group">
                            {% if can_change %}
                            <a href="{% url ref_url|add:'_edit' item.pk %}" class="btn btn-sm btn-outline">✏️</a>
                            {% endif %}
                            {% if can_delete %}
                            <a href="{% url ref_url|add:'_delete' item.pk %}" class="btn btn-sm btn-danger">🗑️</a>
                            {% endif %}
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="2" style="text-align:center; color:var(--text-muted);">Нет записей</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
